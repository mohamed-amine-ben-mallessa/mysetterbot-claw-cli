[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mysetterbot-claw-cli"
version = "0.1.0"
description = "Hybrid Instagram CLI for AI agents (Graph API + private API) — the action layer behind MySetterBot Claw. Fork of clinstagram."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "MySetterBot Claw contributors" }]
keywords = ["instagram", "cli", "dm", "outreach", "agent", "mcp", "setter", "automation"]
dependencies = [
    "httpx>=0.27.0",
    "instagrapi>=2.9.0",
    "keyring>=25.0.0",
    "packaging>=23.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "tomli-w>=1.0.0",
    "typer>=0.12.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/mohamed-amine-ben-mallessa/mysetterbot-claw-cli"
"Upstream (clinstagram)" = "https://github.com/199-biotechnologies/clinstagram"

[project.scripts]
# keep the original entrypoint name so existing skills/agents keep working,
# and add a branded alias.
clinstagram = "clinstagram.cli:app"
msbc = "clinstagram.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/clinstagram"]
